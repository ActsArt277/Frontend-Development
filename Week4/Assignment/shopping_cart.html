<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Shopping Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .instructions {
            background-color: #e8f4f8;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            border-left: 4px solid #0084d1;
        }
    </style>
</head>
<body>
    <h1>My Shopping Cart — open the console to see your summary</h1>
    
    

    <script type="text/javascript">
       
       
        // Declare an array of product names
        const productNames = ["Laptop", "Wireless Mouse", "USB-C Cable", "Monitor Stand", "Keyboard"];
        
        // Declare a parallel array of product prices
        const productPrices = [899.99, 29.99, 15.99, 34.99, 79.99];

        console.log("========== MY SHOPPING CART ==========\n");

        
        // Initialize variable to accumulate the total price
        let subtotal = 0;

        console.log("--- ITEMS IN CART ---");
        // Use a for loop to iterate through the productPrices array
        for (let i = 0; i < productPrices.length; i++) {
            // Add each price to the subtotal
            subtotal += productPrices[i];
            // Print each product name and its price to the console
            console.log(`${i + 1}. ${productNames[i]}: $${productPrices[i].toFixed(2)}`);
        }

        console.log("\n--- PRICING CALCULATION ---");

       
        // Initialize discount percentage and amount variables
        let discountPercentage = 0;
        let discountAmount = 0;
        let finalTotal = 0;

        // Use if/else if/else statement to determine discount based on subtotal
        if (subtotal >= 200) {
            // Subtotal >= $200: apply a 20% discount
            discountPercentage = 20;
        } else if (subtotal >= 100) {
            // Subtotal >= $100: apply a 10% discount
            discountPercentage = 10;
        } else {
            // Subtotal < $100: no discount (0%)
            discountPercentage = 0;
        }

        // Calculate the discount amount
        discountAmount = subtotal * (discountPercentage / 100);
        // Calculate the final total after discount
        finalTotal = subtotal - discountAmount;

       
        // TASK 5: PRINT A CHECKOUT SUMMARY
       
        console.log(`Number of items: ${productNames.length}`);
        console.log(`Subtotal: $${subtotal.toFixed(2)}`);
        console.log(`Discount: ${discountPercentage}% ($${discountAmount.toFixed(2)})`);
        console.log(`Final Total: $${finalTotal.toFixed(2)}`);

        
        // TASK 6: ARRAY OPERATIONS
     
        console.log("\n--- ARRAY OPERATIONS ---");

        // Use the push() method to add one more product and price
        productNames.push("Monitor");
        productPrices.push(299.99);
        console.log("✓ Added new product: Monitor ($299.99)");

        // Use the join() method to print all product names separated by commas
        const allProductsJoined = productNames.join(", ");
        console.log(`\nAll products (joined): ${allProductsJoined}`);

        // Use the sort() method to print product names in alphabetical order
        const sortedProducts = productNames.slice().sort(); // slice() creates a copy to preserve original
        console.log(`\nProducts in alphabetical order: ${sortedProducts.join(", ")}`);

        console.log("\n=====================================\n");


       
            
        

    </script>
</body>
</html>
